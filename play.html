<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>壁打ちゲーム</title>
<style>
html, body { margin:0; width:100%; height:100%; background:#000; overflow:hidden; }
#wrap { position:absolute; left:0; top:0; width:1280px; height:720px; transform-origin:0 0; }
#wrap iframe { display:block; width:1280px; height:720px; border:0; }
</style>
</head>
<body>
<div id="wrap">
  <iframe src="./index.html" allow="fullscreen" scrolling="no"></iframe>
</div>
<script>
function fit() {
  var w = window.innerWidth, h = window.innerHeight;
  var s = Math.min(w / 1280, h / 720);
  var x = (w - 1280 * s) / 2, y = (h - 720 * s) / 2;
  document.getElementById("wrap").style.transform =
    "translate(" + x + "px," + y + "px) scale(" + s + ")";
}
window.addEventListener("resize", fit);
window.addEventListener("orientationchange", fit);
fit();
</script>
</body>
</html>
