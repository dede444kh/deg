<script>
(function () {
  var box = document.getElementById("container");
  function fit() {
    var target = box.firstElementChild;
    if (!target) return;
    // 一度元の大きさに戻して、本来のサイズを測る
    target.style.transform = "none";
    target.style.position = "absolute";
    target.style.left = "0";
    target.style.top = "0";
    var w = target.scrollWidth || target.offsetWidth;
    var h = target.scrollHeight || target.offsetHeight;
    if (!w || !h) return;
    var scale = Math.min(window.innerWidth / w, window.innerHeight / h);
    var x = (window.innerWidth - w * scale) / 2;
    var y = (window.innerHeight - h * scale) / 2;
    target.style.transformOrigin = "0 0";
    target.style.transform = "translate(" + x + "px," + y + "px) scale(" + scale + ")";
  }
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", fit);
  // ゲームの画面ができるのを待って、何度か調整する
  var n = 0;
  var timer = setInterval(function () {
    fit();
    if (++n > 20) clearInterval(timer);
  }, 300);
})();
</script>
